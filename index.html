<style>

    --parchment:#EDE0C8; --parchment-2:#F4EBD6; --card:#F6EEDB; --card-edge: rgba(42,24,16,0.14);
    --ink:#2B1810; --ink-soft:#5A4630; --muted:#8B7355;
    --maroon:#7A2331; --maroon-deep:#4A1620; --gold:#B8863B; --gold-light:#D4A855; --teal:#1F6F6B;
    --good:#3E7A4F; --bad:#9C3B3B;
    --ar: var(--gold); --zu: var(--teal); --es: var(--maroon); --de: #3B5680; --ru: #8B4A6B;
    --accent: var(--gold);
    --font-display: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Naskh Arabic",serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background: var(--parchment); color: var(--ink); font-family: var(--font-ui);
    -webkit-tap-highlight-color: transparent; min-height:100%; display:flex; justify-content:center; position:relative; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background: radial-gradient(ellipse 700px 420px at 10% -8%, rgba(122,35,49,0.07), transparent 60%),
                radial-gradient(ellipse 600px 500px at 100% 110%, rgba(184,134,59,0.10), transparent 60%);
    filter: url(#grain); }
  #app{ width:100%; max-width:480px; min-height:100dvh; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) 0; position:relative; z-index:1; }
  .motif-band{ height:9px; background-color: var(--maroon);

    background-size: 9px 9px; opacity:.85; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 8px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{ width:24px; height:24px; position:relative; flex-shrink:0; cursor:pointer; }
  .brand-mark::before, .brand-mark::after{ content:""; position:absolute; inset:2px; border:1.6px solid var(--maroon); }
  .brand-mark::after{ transform:rotate(45deg); }
  .brand-name{ font-family: var(--font-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-soft); cursor:pointer; }
  .streak-pill{ display:flex; align-items:center; gap:5px; background: rgba(122,35,49,0.08); border:1px solid var(--card-edge);
    border-radius:100px; padding:5px 11px; font-family: var(--font-mono); font-size:12px; color:var(--maroon); }
  main{ flex:1; display:flex; flex-direction:column; padding: 10px 18px 14px; min-height:0; }
  nav.tabbar{ display:flex; border-top:1px solid var(--card-edge); background: var(--parchment-2); }
  nav.tabbar button{ flex:1; background:none; border:none; padding:11px 4px 10px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color: var(--muted); font-family:var(--font-ui); font-size:10px; cursor:pointer; }
  nav.tabbar button .ic{ font-size:18px; line-height:1; }
  nav.tabbar button.active{ color: var(--maroon); font-weight:600; }
 
  h2.title{ font-family: var(--font-display); font-size:21px; margin:2px 0 4px; font-weight:600; }
  p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.5; }
 
  /* language grid */
  .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{ position:relative; background: var(--card); border:1px solid var(--card-edge); border-radius:16px;
    padding:14px 12px 12px; overflow:hidden; cursor:pointer; }
  .tile::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background: var(--tile-accent, var(--gold)); }
  .tile .t-native{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--maroon-deep); margin-top:4px; }
  .tile .t-name{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .tile .t-badge{ position:absolute; top:10px; right:10px; min-width:20px; height:20px; padding:0 5px; border-radius:100px;
    background: var(--tile-accent, var(--gold)); color:#fff; font-family:var(--font-mono); font-size:10.5px;
    display:flex; align-items:center; justify-content:center; }
  .tile .t-progress{ height:4px; background:rgba(42,24,16,0.09); border-radius:100px; margin-top:10px; overflow:hidden; }
  .tile .t-progress-fill{ height:100%; background: var(--tile-accent, var(--gold)); }
  .tile .t-note{ font-size:10px; color:var(--muted); margin-top:6px; font-family:var(--font-mono); }
  .tile .t-neglect{ color:var(--bad); }
 
  .medallion{ width:120px; height:120px; margin:10px auto 4px; position:relative; display:flex; align-items:center; justify-content:center; }
  .medallion::before, .medallion::after{ content:""; position:absolute; inset:8px; border:2px solid var(--accent); filter: url(#inkTexture); }
  .medallion::after{ transform:rotate(45deg); }
  .medallion-inner{ width:72px; height:72px; border-radius:50%; border:1px solid var(--accent); display:flex; align-items:center;
    justify-content:center; text-align:center; font-family: var(--font-display); font-size:20px; color:var(--maroon); font-weight:600; }
 
  .insight-grid{ display:flex; gap:9px; margin:14px 0; }
  .insight{ flex:1; background: var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:12px 10px; text-align:center; }
  .insight .n{ font-family:var(--font-mono); font-size:20px; color:var(--maroon-deep); font-weight:600; }
  .insight .l{ font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.06em; }
 
  .science-note{ background: rgba(31,111,107,0.07); border:1px solid rgba(31,111,107,0.25); border-radius:14px;
    padding:13px 15px; font-size:12px; color: var(--ink-soft); line-height:1.55; margin-top:6px; }
  .science-note b{ color: var(--teal); }
 
  .begin-btn{ margin-top:18px; width:100%; background: var(--maroon); color:var(--parchment-2); border:none; border-radius:16px;
    padding:16px; font-size:15px; font-weight:600; font-family: var(--font-ui); cursor:pointer; }
  .begin-btn:active{ opacity:.88; }
  .link-btn{ background:none; border:none; color:var(--maroon); font-size:13px; text-decoration:underline; cursor:pointer; padding:8px 0; }

  .stamp-wrap{ display:flex; justify-content:center; margin: 2px 0 2px; }
  .stamp{ width:96px; height:96px; position:relative; display:flex; align-items:center; justify-content:center; }
  .stamp::before, .stamp::after{ content:""; position:absolute; inset:5px; border:2px solid var(--accent); filter:url(#inkTexture); }
  .stamp::after{ transform:rotate(45deg); }
  .stamp-inner{ width:60px; height:60px; border-radius:50%; border:1px solid var(--accent); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; }

  .stamp-code{ font-family:var(--font-mono); font-size:7.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
 
  .card{ background: var(--card); border:1px solid var(--card-edge); border-radius:20px; padding: 18px 20px 16px; margin-top:8px;

  .card-tag{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color: var(--accent);

  .card-tag::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); }

  .word-en{ margin-top:5px; font-size:14px; color: var(--muted); }
  .memory-hook{ margin-top:8px; font-size:11.5px; color:var(--teal); font-style:italic; }
 
  .hidden-zone{ text-align:center; padding: 14px 0; }

  .hidden-zone .hint{ font-size:12.5px; color:var(--muted); margin-bottom:12px; }
 
  .replay-btn, .reveal-btn{ margin-top:10px; background: rgba(122,35,49,0.06); border:1px solid var(--card-edge); color:var(--ink);

  .reveal-btn{ background: var(--gold); color: var(--maroon-deep); border:none; font-weight:600; }
 
  .action-zone{ display:flex; flex-direction:column; align-items:center; gap:11px; padding-top:2px; }
  .mic-btn{ width:66px; height:66px; border-radius:50%; border:none; background: var(--maroon); color: var(--parchment-2);

  .mic-label{ font-size:11.5px; color:var(--muted); }

  .row-label{ font-size:13.5px; }

  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; transition:left .18s; }

  .btn{ width:100%; padding:12px; border-radius:12px; border:1px solid var(--card-edge); background: var(--card); color:var(--ink);
    font-size:13px; margin-top:9px; cursor:pointer; text-align:center; }
  .btn.primary{ background: var(--maroon); color:var(--parchment-2); border:none; font-weight:600; }
  .btn.danger{ color: var(--bad); border-color: rgba(156,59,59,.35); }
  .btn.small{ width:auto; padding:8px 14px; font-size:12px; }
  .note{ font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:7px; }
  .custom-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--card-edge); font-size:12.5px; }
  .custom-item button{ background:none; border:none; color:var(--bad); font-size:15px; cursor:pointer; padding:2px 6px; }
 
  .stat-card{ background:var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:13px 15px; margin-bottom:10px; }
  .stat-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .stat-lang{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .stat-lang .dot{ width:8px; height:8px; border-radius:50%; }
  .stat-pct{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .bar-track{ height:6px; background:rgba(42,24,16,0.08); border-radius:100px; margin-top:8px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; }
  .stat-sub{ display:flex; gap:12px; margin-top:7px; font-size:10px; color:var(--muted); font-family:var(--font-mono); flex-wrap:wrap; }
 
  .empty-state{ text-align:center; padding: 46px 10px; color:var(--muted); }
  .empty-state .big{ font-size:34px; margin-bottom:8px; color:var(--gold); }
  a{ color: var(--maroon); }
  ::selection{ background: rgba(184,134,59,0.35); }
</style>
</head>

function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn("could not save progress", e); } }
function getRecord(id){
  if(!state.items[id]){
    state.items[id] = { introduced:false, repetitions:0, easeFactor:2.5, interval:0, dueDate:null, lastSeen:null, history:[] };
  }
  const r = state.items[id];
  // migrate any older shape gracefully
  if(r.repetitions===undefined) r.repetitions = r.streak||0;

   ========================================================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isDue(dueDate){ return !dueDate || dueDate <= todayISO(); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
 
/* =========================================================
   4. TEXT MATCHING
   ========================================================= */
function normalizeText(s){
  if(!s) return "";
  let x = s.toLowerCase().trim();
  x = x.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  x = x.replace(/[\u064B-\u065F\u0670]/g,"");
  x = x.replace(/[^\p{L}\p{N}\s']/gu,"");
  x = x.replace(/\s+/g," ").trim();
  return x;
}
function levenshtein(a,b){
  const m=a.length,n=b.length; if(m===0) return n; if(n===0) return m;
  const dp=new Array(n+1); for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){ let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){ const tmp=dp[j]; dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=tmp; } }
  return dp[n];
}
function confidenceScore(expected, heard){
  const e=normalizeText(expected), h=normalizeText(heard);
  if(!h) return 0;
  const dist = levenshtein(e,h);
  const maxLen = Math.max(e.length,h.length,1);
  return Math.max(0, Math.min(100, Math.round(100*(1-dist/maxLen))));
}
const PASS_THRESHOLD = 45;
 
/* =========================================================
   5. SPEECH — voice selection tuned for quality, not just locale match
   ========================================================= */
let voicesCache = [];
function loadVoices(){ voicesCache = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function scoreVoice(v){
  let score = 0;
  const n = (v.name||"").toLowerCase();
  if(v.localService===false) score += 3;
  if(/google|natural|neural|enhanced|premium|wavenet|siri/.test(n)) score += 4;
  if(/compact|espeak|eloquence/.test(n)) score -= 3;
  return score;
}
function voicesForLang(langTag){
  const prefix = langTag.split("-")[0];
  return voicesCache.filter(v=> v.lang && v.lang.toLowerCase().startsWith(prefix)).sort((a,b)=> scoreVoice(b)-scoreVoice(a));
}
function bestVoiceForLang(lang){
  const langTag = LANGS[lang].ttsLang;
  const exact = voicesCache.filter(v=>v.lang===langTag);
  const pool = exact.length ? exact : voicesForLang(langTag);
  if(!pool.length) return null;
  return pool.slice().sort((a,b)=> scoreVoice(b)-scoreVoice(a))[0];
}
function speak(text, lang){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const langTag = LANGS[lang].ttsLang;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langTag;
  const preferred = state.settings.voicePref[lang];
  let match = preferred ? voicesCache.find(v=> (v.name+"|"+v.lang)===preferred) : null;
  if(!match) match = bestVoiceForLang(lang);
  if(match) u.voice = match;
  u.rate = 0.88;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recognitionSupported(){ return !!SR; }
function listenOnce(langTag, onResult, onError){
  if(!SR){ onError("unsupported"); return null; }
  const rec = new SR();
  rec.lang = langTag; rec.interimResults=false; rec.maxAlternatives=3; rec.continuous=false;
  let done=false;
  rec.onresult = (e)=>{ done=true; onResult(Array.from(e.results[0]).map(a=>a.transcript)); };
  rec.onerror = (e)=>{ if(!done){ done=true; onError(e.error||"error"); } };
  rec.onend = ()=>{ if(!done){ done=true; onError("no-speech"); } };
  try{ rec.start(); }catch(err){ onError("start-failed"); return null; }
  return rec;
}
 
/* =========================================================
   6. SM-2 SPACED REPETITION
   Wozniak's SuperMemo-2 algorithm: after each review you rate recall quality
   0-5; the interval before the next review grows by the "ease factor" as
   long as recall stays good, and resets to 1 day the moment it doesn't.
   ========================================================= */
function sm2Update(rec, quality){
  quality = Math.max(0, Math.min(5, quality));
  if(quality < 3){
    rec.repetitions = 0;
    rec.interval = 1;
  } else {
    if(rec.repetitions === 0) rec.interval = 1;
    else if(rec.repetitions === 1) rec.interval = 6;
    else rec.interval = Math.round(rec.interval * rec.easeFactor);
    rec.repetitions += 1;
  }
  rec.easeFactor = rec.easeFactor + (0.1 - (5-quality)*(0.08+(5-quality)*0.02));
  if(rec.easeFactor < 1.3) rec.easeFactor = 1.3;
  rec.dueDate = addDaysISO(rec.interval);
}
// Map (auto pass/fail, self-rating) onto the 0-5 SM-2 quality scale.
function toQuality(hasAuto, passed, selfRating){
  if(hasAuto){
    if(passed){
      if(selfRating==="good") return 5;
      if(selfRating==="bad") return 3;
      return 4; // unsure or no self-rating, but matched
    } else {
      if(selfRating==="good") return 2; // felt right but recognition didn't match — be lenient
      if(selfRating==="unsure") return 2;
      return 1;
    }
  } else {
    if(selfRating==="good") return 4;
    if(selfRating==="unsure") return 3;
    return 1;
  }
}
 
/* =========================================================
   7. SESSION ENGINE — single active language, interleaved by category
   ========================================================= */
let session = null;
function newItemCap(lang){ return state.settings.background[lang] ? state.settings.newCapBackground : state.settings.newCapZero; }
function phrasesUnlocked(lang){
  const introducedVocab = ITEMS_BY_LANG[lang].filter(it=>it.tier==="vocab" && getRecord(it.id).introduced).length;
  return introducedVocab >= 20;
}
function startSession(){
  if(!state.activeLanguage){ setView("home"); return; }
  session = {
    lang: state.activeLanguage, startTime: Date.now(), turn:0, lastCategory:null,
    newIntroduced:0, requeue:[], currentItem:null, currentIsNew:false, revealed: !state.settings.audioFirstMode,
    answeredCount:0
  };
  setView("session");
}
function poolForActiveLanguage(){
  const lang = session.lang;
  const all = ITEMS_BY_LANG[lang];
  const unlocked = phrasesUnlocked(lang);
  const usable = all.filter(it=> it.tier==="vocab" || unlocked);
  const due = usable.filter(it=>{ const r=getRecord(it.id); return r.introduced && isDue(r.dueDate); });
  const fresh = usable.filter(it=> !getRecord(it.id).introduced);
  return { due, fresh };
}
// interleaving: prefer a different category than last turn, and lean toward the most-overdue items
function pickFromPool(pool){
  if(!pool.length) return null;
  const notSameCat = pool.filter(it=> it.cat !== session.lastCategory);
  const candidates = notSameCat.length ? notSameCat : pool;
  candidates.sort((a,b)=> (getRecord(a.id).dueDate||"") < (getRecord(b.id).dueDate||"") ? -1 : 1);
  const top = candidates.slice(0, Math.min(5, candidates.length));
  return top[Math.floor(Math.random()*top.length)];
}
function pickNextItem(){
  session.turn++;
  const t = session.turn;
  const readyIdx = session.requeue.findIndex(r=> r.dueTurn<=t);
  if(readyIdx>=0){ const entry = session.requeue.splice(readyIdx,1)[0]; return { item: ITEMS[entry.id], isNew:false }; }
  const { due, fresh } = poolForActiveLanguage();
  if(due.length) return { item: pickFromPool(due), isNew:false };
  if(session.newIntroduced < newItemCap(session.lang) && fresh.length) return { item: pickFromPool(fresh), isNew:true };
  return null;
}
function registerActivity(){
  const today = todayISO();
  const st = state.streak;
  if(st.lastActiveDate === today) return;
  const y = addDaysISO(-1);
  st.current = (st.lastActiveDate === y) ? (st.current||0)+1 : 1;
  st.longest = Math.max(st.longest||0, st.current);
  st.lastActiveDate = today;
  saveState();
  renderStreakPill();
}
function recordAnswer(item, hasAuto, passed, confidence, selfRating, heardText){
  const rec = getRecord(item.id);
  const wasIntroduced = rec.introduced;
  rec.introduced = true; rec.lastSeen = todayISO();
  const quality = toQuality(hasAuto, passed, selfRating);
  sm2Update(rec, quality);
  rec.history.push({ date: todayISO(), result: quality>=3?"correct":"incorrect", confidence, selfRating: selfRating||null, heard: heardText||null, quality });
  if(rec.history.length>60) rec.history = rec.history.slice(-60);
  if(quality < 3) session.requeue.push({ id:item.id, dueTurn: session.turn+3 });
  if(!wasIntroduced) session.newIntroduced++;
  saveState();
  return quality;
}
 
/* =========================================================
   8. STATS / INSIGHTS
   ========================================================= */
function computeWeeklyStats(){
  const cutoff = addDaysISO(-7);
  const stats = {};
  LANG_ORDER.forEach(l=>{
    let correct=0,total=0,mastered=0,introduced=0;
    ITEMS_BY_LANG[l].forEach(item=>{
      const rec = state.items[item.id]; if(!rec) return;
      if(rec.introduced) introduced++;
      if((rec.repetitions||0) >= 4) mastered++;
      (rec.history||[]).filter(h=>h.date>=cutoff).forEach(h=>{ total++; if(h.result==="correct") correct++; });
    });
    stats[l] = { correct, total, pct: total? Math.round(100*correct/total): null, mastered, introduced, poolSize: ITEMS_BY_LANG[l].length };
  });
  return stats;
}
function langInsights(l){
  const items = ITEMS_BY_LANG[l];
  let due=0, introduced=0, mastered=0, lastDate=null;
  items.forEach(it=>{
    const rec = state.items[it.id]; if(!rec) return;
    if(rec.introduced){ introduced++; if(isDue(rec.dueDate)) due++; if((rec.repetitions||0)>=4) mastered++; }
    if(rec.lastSeen && (!lastDate || rec.lastSeen>lastDate)) lastDate = rec.lastSeen;
  });
  const daysSince = lastDate ? daysBetween(lastDate, todayISO()) : null;
  return { due, introduced, mastered, poolSize: items.length, daysSince, hasStarted: introduced>0 };
}

  const picked = pickNextItem();
  if(!picked){ renderAllCaughtUp(); return; }
  session.currentItem = picked.item;
  session.currentIsNew = picked.isNew;
  session.revealed = !state.settings.audioFirstMode;
  session.lastCategory = picked.item.cat;
  renderCurrentCard();
  speak(picked.item.native, picked.item.lang);
}
function renderCurrentCard(){
  const item = session.currentItem;
  const lang = LANGS[item.lang];
  setAccent(item.lang);
  const catLabel = item.tier==="phrase" ? "phrase" : item.cat;
  const elapsedMs = Date.now()-session.startTime;
  const hook = state.notes[item.id];
 
  const wordZoneHtml = session.revealed ? `
    <div class="word-native" dir="${lang.rtl?'rtl':'ltr'}">${escapeHtml(item.native)}</div>
    ${item.translit ? `<div class="word-translit">${escapeHtml(item.translit)}</div>` : ``}
    <div class="word-en">${escapeHtml(item.en)}</div>
    ${hook ? `<div class="memory-hook">&#9998; ${escapeHtml(hook)}</div>` : ``}
    <button class="replay-btn" id="replayBtn">&#9658; hear it again</button>
  ` : `
    <div class="hidden-zone">
      <div class="ph">&#9835;</div>
      <div class="hint">listen, then say it back — reveal when you're ready to check</div>
      <button class="replay-btn" id="replayBtn">&#9658; hear it again</button><br>
      <button class="reveal-btn" id="revealBtn">reveal word</button>
    </div>
  `;
 
  $main.innerHTML = `
    <div class="stamp-wrap"><div class="stamp"><div class="stamp-inner">
      <div class="stamp-native" style="direction:${lang.rtl?'rtl':'ltr'}">${escapeHtml(lang.native)}</div>
      <div class="stamp-code">${item.lang}</div>
    </div></div></div>
    <div class="card">
      <div class="card-tag">${lang.name} &middot; ${catLabel}${session.currentIsNew?" &middot; new":""}<span class="interleave-tag">${session.lastCategory?'':''}</span></div>
      <div class="word-zone">${wordZoneHtml}</div>
      <div class="action-zone" id="actionZone">
        <button class="mic-btn" id="micBtn">&#127908;</button>
        <div class="mic-label" id="micLabel">${recognitionSupported() ? "tap and say it out loud" : "mic input not supported here — rate yourself after listening"}</div>
      </div>
    </div>
    <div class="session-bar">
      <span>${Math.floor(elapsedMs/60000)}:${String(Math.floor((elapsedMs%60000)/1000)).padStart(2,"0")} <span class="dim">/ ${state.settings.dailyBudgetMin}:00</span></span>
      <span>${session.answeredCount} reviewed</span>
    </div>
  `;
  document.getElementById("replayBtn").onclick = ()=> speak(item.native, item.lang);
  const revealBtn = document.getElementById("revealBtn");
  if(revealBtn) revealBtn.onclick = ()=>{ session.revealed = true; renderCurrentCard(); };
  document.getElementById("micBtn").onclick = ()=> handleMic(item, lang);
}
function handleMic(item, lang){
  const micBtn = document.getElementById("micBtn");
  const micLabel = document.getElementById("micLabel");
  if(!recognitionSupported()){ showResult(item, lang, false, null, null); return; }
  micBtn.classList.add("listening"); micLabel.textContent = "listening…"; micBtn.disabled = true;
  listenOnce(lang.ttsLang,
    (alternatives)=>{
      micBtn.classList.remove("listening");
      let best = { text:"", score:-1 };
      alternatives.forEach(t=>{ const s = confidenceScore(item.native, t); if(s>best.score) best = { text:t, score:s }; });
      session.revealed = true;
      showResult(item, lang, true, best.text, best.score);
    },
    (err)=>{
      micBtn.classList.remove("listening");
      micLabel.textContent = err==="not-allowed" ? "microphone permission denied" : "didn't catch that — try again or rate yourself";
      micBtn.disabled = false;
    }
  );
}
function showResult(item, lang, hasAuto, heardText, confidence){
  const passed = hasAuto && confidence!==null && confidence>=PASS_THRESHOLD;
  renderCurrentCard();
  const $zone = document.getElementById("actionZone");
  $zone.innerHTML = `
    <div class="result-panel">
      ${hasAuto ? `
        <div class="heard-row">you said: <b>${escapeHtml(heardText||"(nothing heard)")}</b></div>
        <div>
          <div class="meter"><div class="meter-fill" style="width:${confidence}%; background:${passed?'var(--good)':'var(--bad)'}"></div></div>
          <div class="meter-label"><span>confidence</span><span>${confidence}%</span></div>
        </div>
        <div class="verdict ${passed?'pass':'fail'}">${passed? '&#10003; close enough' : '&#10005; try again next time'}</div>
      ` : `<div class="heard-row">no automatic scoring available — rate your own attempt</div>`}
      <div>
        <div class="row-sub" style="margin-bottom:6px;">how did it feel?</div>
        <div class="self-rate" id="selfRate">
          <button data-v="good">felt right</button>
          <button data-v="unsure">not sure</button>
          <button data-v="bad">way off</button>
        </div>
      </div>
      <button class="next-btn" id="nextBtn">next</button>
    </div>
  `;
  let selfRating = null;
  document.querySelectorAll("#selfRate button").forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll("#selfRate button").forEach(x=>x.classList.remove("picked")); b.classList.add("picked"); selfRating=b.dataset.v; };
  });
  document.getElementById("nextBtn").onclick = ()=>{
    if(session.answeredCount===0) registerActivity();
    recordAnswer(item, hasAuto, passed, hasAuto?confidence:null, selfRating, heardText);
    session.answeredCount++;
    renderSessionTurn();
  };
}
function renderAllCaughtUp(){
  document.documentElement.style.setProperty("--accent","var(--maroon)");
  const elapsedMin = Math.round((Date.now()-session.startTime)/60000);
  $main.innerHTML = `
    <div class="empty-state">
      <div class="big">&#10022;</div>
      <div style="font-size:15px; color:var(--ink); margin-bottom:6px; font-family:var(--font-display);">All caught up in ${LANGS[session.lang].name} for now</div>
      <div style="font-size:12.5px;">${session.answeredCount} reviewed &middot; ${elapsedMin} min this session</div>
      <button class="btn primary" id="restartBtn" style="margin-top:20px;">start another round</button>
      <button class="btn" id="homeBtn">choose a different language</button>
    </div>
  `;
  document.getElementById("restartBtn").onclick = ()=> startSession();
  document.getElementById("homeBtn").onclick = ()=> setView("home");
}
 
/* =========================================================
   13. STATS VIEW
   ========================================================= */
function renderStats(){
  document.documentElement.style.setProperty("--accent","var(--maroon)");
  const stats = computeWeeklyStats();
  let rows = "";
  LANG_ORDER.forEach(l=>{
    const s = stats[l];
    const accent = `var(${LANGS[l].accentVar})`;
    rows += `
      <div class="stat-card">
        <div class="stat-top"><div class="stat-lang"><span class="dot" style="background:${accent}"></span>${LANGS[l].name}</div>
        <div class="stat-pct">${s.pct===null? "no data yet" : s.pct+"% this week"}</div></div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.pct||0}%; background:${accent}"></div></div>
        <div class="stat-sub"><span>${s.introduced}/${s.poolSize} introduced</span><span>${s.mastered} mastered</span><span>${s.total} reviews (7d)</span></div>
      </div>`;
  });
  $main.innerHTML = `
    <h2 class="title">This week</h2>
    <div class="row" style="border:none; padding:0 0 10px;">
      <div class="row-label">Current streak</div>
      <div class="row-sub" style="margin:0; font-size:13px;">&#128293; ${state.streak.current||0} days &middot; best ${state.streak.longest||0}</div>
    </div>
    ${rows}
    <button class="btn" id="exportBtn2">Copy this week's log (for weekly plan prompt)</button>
  `;
  document.getElementById("exportBtn2").onclick = doExport;
}
 
/* =========================================================
   14. SETTINGS VIEW
   ========================================================= */
function renderSettings(){
  document.documentElement.style.setProperty("--accent","var(--maroon)");
  const s = state.settings;
  $main.innerHTML = `
    <h2 class="title">Settings</h2>
 
    <h3>Why this app is built this way</h3>
    <div class="science-note">
      Three techniques with strong research support drive the scheduling: <b>spaced repetition</b> (SM-2 — items resurface right before you'd
      likely forget them, Wozniak 1987, built on Ebbinghaus's forgetting curve), <b>retrieval practice</b> (saying the word out loud beats
      re-reading it — Roediger &amp; Karpicke, 2006), and <b>interleaving</b> (mixing categories instead of blocking them — harder in the
      moment, better for long-term recall — Rohrer &amp; Taylor, 2007). Dunlosky et al.'s 2013 review of ten study techniques rated practice
      testing and spaced practice the two highest-value methods, which is why the app leans on those rather than things like re-reading or
      highlighting, which the same review found do little.
    </div>
 
    <h3>Daily session</h3>
    <div class="row"><div><div class="row-label">Default length</div><div class="row-sub">tracked, not enforced</div></div>
      <select id="budgetSelect">${[10,15,20,30,45].map(m=>`<option value="${m}" ${m===s.dailyBudgetMin?"selected":""}>${m} min</option>`).join("")}</select>
    </div>
    <div class="row"><div><div class="row-label">Audio-first mode</div><div class="row-sub">hide text until you attempt recall from audio alone</div></div>
      <div class="switch ${s.audioFirstMode?'on':''}" id="audioFirstSwitch"></div>
    </div>
 
    <h3>Background</h3>
    <div class="note" style="margin-top:-4px; margin-bottom:4px;">More new words per session (${s.newCapBackground} vs ${s.newCapZero}) for languages you already know.</div>
    ${LANG_ORDER.map(l=>`<div class="row"><div class="row-label">${LANGS[l].name}</div><div class="switch ${s.background[l]?'on':''}" data-lang="${l}"></div></div>`).join("")}
 
    <h3>Voices</h3>
    <div class="note" style="margin-top:-4px; margin-bottom:6px;">
      These are synthetic voices built into your browser/device — not recordings of real speakers. I can't source or fabricate genuine
      native-speaker audio here. What I can do is default to the best-sounding installed voice for each language (network/"natural"-labelled
      voices are preferred automatically) and let you override the choice below if your device has more than one option.
    </div>
    ${LANG_ORDER.map(l=>renderVoiceRow(l)).join("")}
 
    <h3>Add your own words</h3>
    <div class="note" style="margin-top:-4px;">Extend any language's vocabulary — your additions get reviewed on the same schedule.</div>
    ${LANG_ORDER.map(l=>renderCustomWordsBlock(l)).join("")}
 
    <h3>Your data</h3>
    <button class="btn" id="exportBtn">Copy this week's log (for weekly plan prompt)</button>
    <button class="btn danger" id="resetBtn">Reset all progress</button>
    <div class="note">Progress is stored only on this device, in this browser. Nothing is uploaded anywhere.</div>
  `;
 
  document.getElementById("budgetSelect").onchange = (e)=>{ s.dailyBudgetMin = parseInt(e.target.value,10); saveState(); };
  document.getElementById("audioFirstSwitch").onclick = ()=>{ s.audioFirstMode = !s.audioFirstMode; saveState(); renderSettings(); };
  document.querySelectorAll(".switch[data-lang]").forEach(sw=>{
    sw.onclick = ()=>{ const l=sw.dataset.lang; s.background[l]=!s.background[l]; sw.classList.toggle("on", s.background[l]); saveState(); };
  });
  LANG_ORDER.forEach(l=>{
    const sel = document.getElementById("voiceSelect-"+l);
    if(sel) sel.onchange = (e)=>{ s.voicePref[l] = e.target.value; saveState(); };
    const testBtn = document.getElementById("voiceTest-"+l);
    if(testBtn) testBtn.onclick = ()=>{ speak(VOCAB[l].words[0][0], l); };
    const addBtn = document.getElementById("addWord-"+l);
    if(addBtn) addBtn.onclick = ()=> addCustomWord(l);
  });
  document.querySelectorAll(".custom-item button[data-del]").forEach(b=> b.onclick = ()=> deleteCustomWord(b.dataset.del));
  document.getElementById("exportBtn").onclick = doExport;
  document.getElementById("resetBtn").onclick = ()=>{
    if(confirm("This clears all review history and progress on this device. Continue?")){
      state.items = {}; saveState(); session = null; setView("home");
    }
  };
}
function renderVoiceRow(l){
  const langTag = LANGS[l].ttsLang;
  const options = voicesForLang(langTag);
  const current = state.settings.voicePref[l] || "";
  return `
    <div class="row"><div class="row-label">${LANGS[l].name}</div>
      <div style="display:flex; gap:6px; align-items:center;">
        <select id="voiceSelect-${l}" style="max-width:150px;">
          <option value="">auto (best available)</option>
          ${options.map(v=>`<option value="${escapeHtml(v.name+"|"+v.lang)}" ${current===(v.name+"|"+v.lang)?"selected":""}>${escapeHtml(v.name)}</option>`).join("")}
        </select>
        <button class="btn small" id="voiceTest-${l}">&#9658;</button>
      </div>
    </div>
    ${options.length===0 ? `<div class="note" style="margin-top:-2px;">no ${LANGS[l].name} voice installed on this device — default system voice will be used</div>` : ``}
  `;
}
function renderCustomWordsBlock(l){
  const mine = (state.customItems||[]).filter(it=>it.lang===l);
  return `
    <div class="row-sub" style="margin:12px 0 6px; font-weight:600; color:var(--ink-soft);">${LANGS[l].name}</div>
    ${mine.map(it=>`<div class="custom-item"><span>${escapeHtml(it.native)} — ${escapeHtml(it.en)}</span><button data-del="${it.id}">&times;</button></div>`).join("")}
    <input type="text" id="cw-native-${l}" placeholder="word/phrase (native script)">
    <input type="text" id="cw-translit-${l}" placeholder="transliteration (optional)">
    <input type="text" id="cw-en-${l}" placeholder="English meaning">
    <button class="btn small" id="addWord-${l}">Add word</button>
  `;
}
function addCustomWord(l){
  const native = document.getElementById("cw-native-"+l).value.trim();
  const translit = document.getElementById("cw-translit-"+l).value.trim();
  const en = document.getElementById("cw-en-"+l).value.trim();
  if(!native || !en){ alert("Please fill in at least the word and its English meaning."); return; }
  const id = "custom-"+l+"-"+Date.now()+"-"+Math.floor(Math.random()*1000);
  state.customItems.push({ id, lang:l, tier:"vocab", native, translit: translit||null, en, cat:"custom" });
  saveState(); rebuildItemsIndex(); renderSettings();
}
function deleteCustomWord(id){
  state.customItems = (state.customItems||[]).filter(it=>it.id!==id);
  delete state.items[id]; delete state.notes[id];
  saveState(); rebuildItemsIndex(); renderSettings();
}
 
/* =========================================================
   15. EXPORT
   ========================================================= */
function doExport(){
  const cutoff = addDaysISO(-7);
  const byLang = {}; LANG_ORDER.forEach(l=> byLang[l]=[]);
  Object.values(ITEMS).forEach(item=>{
    const rec = state.items[item.id]; if(!rec) return;
    const recent = (rec.history||[]).filter(h=>h.date>=cutoff); if(recent.length===0) return;
    byLang[item.lang].push({ native:item.native, translit:item.translit, en:item.en, category:item.cat, tier:item.tier,
      repetitions:rec.repetitions, easeFactor:Math.round(rec.easeFactor*100)/100, interval:rec.interval, history:recent });
  });
  const payload = { generated: todayISO(), streak: state.streak, note:"Weekly log from the Five Languages app — paste this after the weekly lesson plan prompt.", languages: byLang };
  const text = JSON.stringify(payload, null, 2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> alert("Weekly log copied. Paste it into a chat with your weekly lesson plan prompt."), ()=> fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Weekly log copied."); } catch(e){ prompt("Copy this manually:", text); }
  document.body.removeChild(ta);
}
 
/* =========================================================
   16. ONBOARDING
   ========================================================= */
function renderOnboarding(){
  const s = state.settings;
  $main.innerHTML = `
    <div class="medallion"><div class="medallion-inner">5</div></div>
    <h2 class="title" style="text-align:center;">Five Languages, One Adult</h2>
    <p class="sub" style="text-align:center;">Pick one language at a time to focus on. Spaced repetition (SM-2) and interleaving handle the scheduling.</p>
    <h3>Background</h3>
    ${LANG_ORDER.map(l=>`<div class="row"><div class="row-label">${LANGS[l].name}</div><div class="switch ${s.background[l]?'on':''}" data-lang="${l}"></div></div>`).join("")}
    <h3>Daily length</h3>
    <div class="row"><div class="row-label">Default session</div>
      <select id="budgetSelect2">${[10,15,20,30,45].map(m=>`<option value="${m}" ${m===s.dailyBudgetMin?"selected":""}>${m} min</option>`).join("")}</select>
    </div>
    <button class="btn primary" id="startBtn" style="margin-top:20px;">Choose your first language</button>
    <div class="note">Everything runs locally — no account, no server. Add this page to your home screen to open it like an app.</div>
  `;
  document.querySelectorAll(".switch[data-lang]").forEach(sw=>{
    sw.onclick = ()=>{ const l=sw.dataset.lang; s.background[l]=!s.background[l]; sw.classList.toggle("on", s.background[l]); };
  });
  document.getElementById("budgetSelect2").onchange = (e)=>{ s.dailyBudgetMin = parseInt(e.target.value,10); };
  document.getElementById("startBtn").onclick = ()=>{ s.onboarded = true; saveState(); setView("home"); };
}
 
/* =========================================================
   17. MANIFEST + SERVICE WORKER
   ========================================================= */
(function setupManifest(){
  const manifest = { name:"Five Languages, One Adult", short_name:"5 Languages", start_url:"./index.html",
    display:"standalone", background_color:"#EDE0C8", theme_color:"#7A2331", icons:[] };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
  document.getElementById("manifestLink").setAttribute("href", "data:application/manifest+json;base64,"+b64);
})();
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
 
/* =========================================================
   18. BOOT
   ========================================================= */
if(!state.settings.onboarded){ renderOnboarding(); document.querySelectorAll("#tabbar button").forEach(b=>b.style.visibility="hidden"); }
else { document.querySelectorAll("#tabbar button").forEach(b=>b.style.visibility="visible"); setView("home"); }
 
})();
</script>
