<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5 Languages">
<meta name="theme-color" content="#7A2331">
<title>Five Languages, One Adult</title>
<link id="manifestLink" rel="manifest" href="">
<style>
  :root{
    --parchment:#EDE0C8;
    --parchment-2:#F4EBD6;
    --card:#F6EEDB;
    --card-edge: rgba(42,24,16,0.14);
    --ink:#2B1810;
    --ink-soft:#5A4630;
    --muted:#8B7355;
    --maroon:#7A2331;
    --maroon-deep:#4A1620;
    --gold:#B8863B;
    --gold-light:#D4A855;
    --teal:#1F6F6B;
    --good:#3E7A4F;
    --bad:#9C3B3B;
 
    --ar: var(--gold);
    --zu: var(--teal);
    --es: var(--maroon);
    --de: #3B5680;
    --ru: #8B4A6B;
 
    --accent: var(--gold);
    --font-display: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Naskh Arabic",serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--parchment);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-tap-highlight-color: transparent;
    min-height:100%;
    display:flex;
    justify-content:center;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.5;
    background:
      radial-gradient(ellipse 700px 420px at 10% -8%, rgba(122,35,49,0.07), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 110%, rgba(184,134,59,0.10), transparent 60%);
    filter: url(#grain);
  }
  #app{
    width:100%; max-width:480px; min-height:100dvh;
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) 0;
    position:relative; z-index:1;
  }
 
  /* ---------- motif band ---------- */
  .motif-band{
    height:9px;
    background-color: var(--maroon);
    background-image:
      linear-gradient(135deg, var(--gold-light) 25%, transparent 25.5%),
      linear-gradient(-135deg, var(--gold-light) 25%, transparent 25.5%);
    background-size: 9px 9px;
    opacity:.85;
  }
 
  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px;
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    width:26px; height:26px; position:relative; flex-shrink:0;
  }
  .brand-mark::before, .brand-mark::after{
    content:""; position:absolute; inset:2px; border:1.6px solid var(--maroon);
  }
  .brand-mark::after{ transform:rotate(45deg); }
  .brand-name{
    font-family: var(--font-mono); font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .streak-pill{
    display:flex; align-items:center; gap:5px;
    background: rgba(122,35,49,0.08);
    border:1px solid var(--card-edge);
    border-radius:100px; padding:5px 11px;
    font-family: var(--font-mono); font-size:12px; color:var(--maroon);
  }
 
  main{ flex:1; display:flex; flex-direction:column; padding: 10px 18px 14px; min-height:0; }
 
  /* ---------- bottom nav ---------- */
  nav.tabbar{
    display:flex; border-top:1px solid var(--card-edge);
    background: var(--parchment-2);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:11px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--muted); font-family:var(--font-ui); font-size:10.5px; cursor:pointer;
  }
  nav.tabbar button .ic{ font-size:18px; line-height:1; }
  nav.tabbar button.active{ color: var(--maroon); font-weight:600; }
 
  /* ---------- dashboard ---------- */
  .dash-hero{
    text-align:center; padding: 10px 6px 4px;
  }
  .dash-hero h2{
    font-family: var(--font-display); font-size:23px; margin:2px 0 4px; font-weight:600;
  }
  .dash-hero p{ font-size:13px; color:var(--ink-soft); margin:0; line-height:1.5; }
 
  .medallion{
    width:130px; height:130px; margin:14px auto 6px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .medallion::before, .medallion::after{
    content:""; position:absolute; inset:8px; border:2px solid var(--accent);
    filter: url(#inkTexture);
  }
  .medallion::after{ transform:rotate(45deg); }
  .medallion-inner{
    width:78px; height:78px; border-radius:50%; border:1px solid var(--accent);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family: var(--font-mono); font-size:26px; color:var(--maroon); font-weight:600;
  }
 
  .lang-grid{ display:flex; flex-direction:column; gap:9px; margin-top:16px; }
  .lang-row{
    display:flex; align-items:center; gap:12px;
    background: var(--card); border:1px solid var(--card-edge); border-radius:14px;
    padding:11px 14px;
  }
  .lang-row .swatch{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .lang-row .lr-name{ font-size:13.5px; flex:1; }
  .lang-row .lr-note{ font-size:11px; font-family:var(--font-mono); color:var(--muted); }
  .lang-row.starving{ border-color: rgba(156,59,59,0.4); background: rgba(156,59,59,0.06); }
  .lang-row.starving .lr-note{ color: var(--bad); }
 
  .begin-btn{
    margin-top:20px; width:100%; background: var(--maroon); color:var(--parchment-2);
    border:none; border-radius:16px; padding:16px; font-size:15.5px; font-weight:600;
    font-family: var(--font-ui); cursor:pointer; letter-spacing:.01em;
  }
  .begin-btn:active{ opacity:.88; }
 
  .starving-banner{
    margin-top:16px; background: rgba(156,59,59,0.08); border:1px solid rgba(156,59,59,0.3);
    border-radius:14px; padding:13px 15px; font-size:12.5px; color: var(--maroon-deep); line-height:1.5;
  }
  .starving-banner b{ color: var(--bad); }
 
  /* ---------- session card ---------- */
  .stamp-wrap{ display:flex; justify-content:center; margin: 4px 0 2px; }
  .stamp{ width:104px; height:104px; position:relative; display:flex; align-items:center; justify-content:center; }
  .stamp::before, .stamp::after{ content:""; position:absolute; inset:5px; border:2px solid var(--accent); filter:url(#inkTexture); }
  .stamp::after{ transform:rotate(45deg); }
  .stamp-inner{
    width:66px; height:66px; border-radius:50%; border:1px solid var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .stamp-native{ font-size:16px; font-weight:600; color:var(--maroon); }
  .stamp-code{ font-family:var(--font-mono); font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
 
  .card{
    background: var(--card); border:1px solid var(--card-edge); border-radius:20px;
    padding: 20px 20px 18px; margin-top:10px; flex:1; display:flex; flex-direction:column; min-height:0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  .card-tag{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase;
    color: var(--accent); margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .card-tag::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); }
 
  .word-zone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; padding:4px 0 12px; }
  .word-native{ font-family: var(--font-display); font-size:40px; font-weight:600; line-height:1.2; color:var(--maroon-deep); word-break:break-word; }
  .word-translit{ font-family: var(--font-mono); font-size:15px; color: var(--ink-soft); }
  .word-en{ margin-top:6px; font-size:14.5px; color: var(--muted); }
 
  .hidden-zone{ text-align:center; padding: 18px 0; }
  .hidden-zone .ph{ font-size:34px; margin-bottom:8px; color: var(--accent); }
  .hidden-zone .hint{ font-size:13px; color:var(--muted); margin-bottom:14px; }
 
  .replay-btn, .reveal-btn{
    margin-top:12px; background: rgba(122,35,49,0.06); border:1px solid var(--card-edge); color:var(--ink);
    padding:8px 16px; border-radius:100px; font-size:12.5px; display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  }
  .reveal-btn{ background: var(--gold); color: var(--maroon-deep); border:none; font-weight:600; }
 
  .action-zone{ display:flex; flex-direction:column; align-items:center; gap:12px; padding-top:4px; }
  .mic-btn{
    width:70px; height:70px; border-radius:50%; border:none; background: var(--maroon);
    color: var(--parchment-2); font-size:24px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: transform .15s;
  }
  .mic-btn:active{ transform:scale(.94); }
  .mic-btn.listening{ animation:pulse 1.1s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(122,35,49,.32); }
    70%{ box-shadow:0 0 0 16px rgba(122,35,49,0); }
    100%{ box-shadow:0 0 0 0 rgba(122,35,49,0); }
  }
  .mic-label{ font-size:12px; color:var(--muted); }
 
  .result-panel{ width:100%; display:flex; flex-direction:column; gap:11px; }
  .heard-row{ background: rgba(122,35,49,0.05); border-radius:12px; padding:11px 13px; font-size:13.5px; color:var(--ink-soft); }
  .heard-row b{ color:var(--ink); font-weight:600; }
  .meter{ height:7px; border-radius:100px; background:rgba(42,24,16,0.09); overflow:hidden; }
  .meter-fill{ height:100%; border-radius:100px; transition:width .4s; }
  .meter-label{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:4px; }
  .verdict{ font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .verdict.pass{ color: var(--good); }
  .verdict.fail{ color: var(--bad); }
 
  .self-rate{ display:flex; gap:7px; }
  .self-rate button{ flex:1; padding:9px 5px; border-radius:12px; border:1px solid var(--card-edge); background:rgba(122,35,49,0.03); color:var(--ink-soft); font-size:12px; cursor:pointer; }
  .self-rate button.picked{ border-color: var(--accent); color: var(--maroon-deep); background: rgba(184,134,59,0.14); }
 
  .next-btn{ margin-top:2px; background: var(--maroon-deep); color:var(--parchment-2); border:none; border-radius:14px; padding:14px; font-size:14.5px; font-weight:600; cursor:pointer; }
  .next-btn:active{ opacity:.86; }
 
  .session-bar{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px 2px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); }
  .session-bar .dim{ opacity:.7; }
 
  /* ---------- panels ---------- */
  .panel{ padding-top:2px; }
  .panel h2{ font-family: var(--font-display); font-size:21px; margin:2px 0 14px; }
  .panel h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:20px 0 8px; }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--card-edge); gap:12px; }
  .row:last-child{ border-bottom:none; }
  .row-label{ font-size:14px; }
  .row-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .switch{ position:relative; width:42px; height:25px; border-radius:100px; background:rgba(42,24,16,0.13); cursor:pointer; flex-shrink:0; }
  .switch.on{ background: var(--maroon); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; transition:left .18s; }
  .switch.on::after{ left:20px; }
  select, input[type=text]{
    background: var(--parchment-2); color:var(--ink); border:1px solid var(--card-edge);
    border-radius:10px; padding:8px 10px; font-size:13.5px; font-family:var(--font-ui);
  }
  input[type=text]{ width:100%; margin-bottom:8px; }
  .btn{ width:100%; padding:12.5px; border-radius:12px; border:1px solid var(--card-edge); background: var(--card); color:var(--ink); font-size:13.5px; margin-top:9px; cursor:pointer; text-align:center; }
  .btn.primary{ background: var(--maroon); color:var(--parchment-2); border:none; font-weight:600; }
  .btn.danger{ color: var(--bad); border-color: rgba(156,59,59,.35); }
  .btn.small{ width:auto; padding:8px 14px; font-size:12.5px; }
  .note{ font-size:12px; color:var(--muted); line-height:1.55; margin-top:7px; }
 
  .custom-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--card-edge); font-size:13px; }
  .custom-item button{ background:none; border:none; color:var(--bad); font-size:15px; cursor:pointer; padding:2px 6px; }
 
  .stat-grid{ display:flex; flex-direction:column; gap:10px; }
  .stat-card{ background:var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:13px 15px; }
  .stat-card.starving{ border-color: rgba(156,59,59,0.4); }
  .stat-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .stat-lang{ font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .stat-lang .dot{ width:8px; height:8px; border-radius:50%; }
  .stat-pct{ font-family:var(--font-mono); font-size:12.5px; color:var(--muted); }
  .bar-track{ height:6px; background:rgba(42,24,16,0.08); border-radius:100px; margin-top:8px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; }
  .stat-sub{ display:flex; gap:12px; margin-top:7px; font-size:10.5px; color:var(--muted); font-family:var(--font-mono); flex-wrap:wrap; }
  .starving-tag{ display:inline-block; margin-top:7px; font-size:10.5px; color:var(--bad); font-family:var(--font-mono); }
 
  .empty-state{ text-align:center; padding: 50px 10px; color:var(--muted); }
  .empty-state .big{ font-size:36px; margin-bottom:8px; color:var(--gold); }
 
  a{ color: var(--maroon); }
  ::selection{ background: rgba(184,134,59,0.35); }
</style>
</head>

<svg width="0" height="0" style="position:absolute">

    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="4"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>

  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="noise" seed="7"/>

</div>

const STORAGE_KEY = "fivelang_state_v2";
 
function defaultState(){
  return {
    settings: {
      dailyBudgetMin: 15,

      newCapBackground: 5,

    },

  };
}
let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    return {
      settings: Object.assign(d.settings, parsed.settings||{}),
      items: parsed.items || {},
      customItems: parsed.customItems || [],
      streak: Object.assign(d.streak, parsed.streak||{})
    };
  }catch(e){ console.warn("could not read saved progress, starting fresh", e); return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("could not save progress", e); }
}
function getRecord(id){
  if(!state.items[id]) state.items[id] = { introduced:false, streak:0, mastered:false, dueDate:null, lastSeen:null, history:[] };
  return state.items[id];
}

/* =========================================================
   3. DATE HELPERS
   ========================================================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isDue(dueDate){ return !dueDate || dueDate <= todayISO(); }
 
/* =========================================================
   4. TEXT MATCHING
   ========================================================= */
function normalizeText(s){
  if(!s) return "";
  let x = s.toLowerCase().trim();
  x = x.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  x = x.replace(/[\u064B-\u065F\u0670]/g,"");
  x = x.replace(/[^\p{L}\p{N}\s']/gu,"");
  x = x.replace(/\s+/g," ").trim();
  return x;
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = new Array(n+1);
  for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){
    let prev = dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp = dp[j];
      dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1]===b[j-1]?0:1));
      prev = tmp;
    }
  }
  return dp[n];
}
function confidenceScore(expected, heard){
  const e = normalizeText(expected), h = normalizeText(heard);
  if(!h) return 0;
  const dist = levenshtein(e,h);
  const maxLen = Math.max(e.length, h.length, 1);
  return Math.max(0, Math.min(100, Math.round(100*(1-dist/maxLen))));
}
const PASS_THRESHOLD = 45;
 
/* =========================================================
   5. SPEECH
   ========================================================= */
let voicesCache = [];
function loadVoices(){ voicesCache = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voicesForLang(langTag){
  const prefix = langTag.split("-")[0];
  return voicesCache.filter(v=> v.lang && v.lang.toLowerCase().startsWith(prefix));
}
function speak(text, lang){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const langTag = LANGS[lang].ttsLang;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langTag;
  const preferred = state.settings.voicePref[lang];
  let match = null;
  if(preferred) match = voicesCache.find(v=> (v.name+"|"+v.lang)===preferred);
  if(!match) match = voicesCache.find(v=>v.lang===langTag) || voicesForLang(langTag)[0];
  if(match) u.voice = match;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recognitionSupported(){ return !!SR; }
function listenOnce(langTag, onResult, onError){
  if(!SR){ onError("unsupported"); return null; }
  const rec = new SR();
  rec.lang = langTag; rec.interimResults=false; rec.maxAlternatives=3; rec.continuous=false;
  let done=false;
  rec.onresult = (e)=>{ done=true; onResult(Array.from(e.results[0]).map(a=>a.transcript)); };
  rec.onerror = (e)=>{ if(!done){ done=true; onError(e.error||"error"); } };
  rec.onend = ()=>{ if(!done){ done=true; onError("no-speech"); } };
  try{ rec.start(); }catch(err){ onError("start-failed"); return null; }
  return rec;
}
 
/* =========================================================
   6. SESSION ENGINE
   ========================================================= */
let session = null;
function newItemCap(lang){ return state.settings.background[lang] ? state.settings.newCapBackground : state.settings.newCapZero; }
function phrasesUnlocked(lang){
  const introducedVocab = ITEMS_BY_LANG[lang].filter(it=>it.tier==="vocab" && getRecord(it.id).introduced).length;
  return introducedVocab >= 20;
}
function startSession(){
  session = {
    startTime: Date.now(), turn:0, lastLang:null,
    newIntroducedCount: Object.fromEntries(LANG_ORDER.map(l=>[l,0])),
    requeue: [], currentItem:null, currentIsNew:false, revealed:!state.settings.audioFirstMode,
    answeredCount:0
  };
  setView("session");
}
function poolsForLang(lang){
  const all = ITEMS_BY_LANG[lang];
  const unlocked = phrasesUnlocked(lang);
  const usable = all.filter(it=> it.tier==="vocab" || unlocked);
  const due = usable.filter(it=>{ const r=getRecord(it.id); return r.introduced && isDue(r.dueDate); });
  const fresh = usable.filter(it=> !getRecord(it.id).introduced);
  return { due, fresh };
}
function pickNextItem(){
  session.turn++;
  const t = session.turn;
  const readyIdx0 = session.requeue.findIndex(r=> r.dueTurn<=t && r.lang!==session.lastLang);
  const readyIdx = readyIdx0>=0 ? readyIdx0 : session.requeue.findIndex(r=> r.dueTurn<=t);
  if(readyIdx>=0){ const entry = session.requeue.splice(readyIdx,1)[0]; return { item: ITEMS[entry.id], isNew:false }; }
  const langsPreferred = LANG_ORDER.filter(l=>l!==session.lastLang);
  function tryLangs(list){
    const shuffled = [...list].sort(()=>Math.random()-0.5);
    for(const lang of shuffled){
      const {due} = poolsForLang(lang);
      if(due.length){ due.sort((a,b)=> (getRecord(a.id).dueDate||"") < (getRecord(b.id).dueDate||"") ? -1:1); return { item:due[0], isNew:false }; }
    }
    for(const lang of shuffled){
      if(session.newIntroducedCount[lang] >= newItemCap(lang)) continue;
      const {fresh} = poolsForLang(lang);
      if(fresh.length) return { item:fresh[0], isNew:true };
    }
    return null;
  }
  return tryLangs(langsPreferred) || tryLangs(LANG_ORDER);
}
function registerActivity(){
  const today = todayISO();
  const st = state.streak;
  if(st.lastActiveDate === today) return;
  const y = addDaysISO(-1);
  st.current = (st.lastActiveDate === y) ? (st.current||0)+1 : 1;
  st.longest = Math.max(st.longest||0, st.current);
  st.lastActiveDate = today;
  saveState();
  renderStreakPill();
}
function recordAnswer(item, passed, confidence, selfRating, heardText){
  const rec = getRecord(item.id);
  const wasIntroduced = rec.introduced;
  rec.introduced = true; rec.lastSeen = todayISO();
  rec.history.push({ date: todayISO(), result: passed?"correct":"incorrect", confidence, selfRating: selfRating||null, heard: heardText||null });
  if(rec.history.length>60) rec.history = rec.history.slice(-60);
  if(passed){
    rec.streak = (rec.streak||0)+1;
    if(rec.streak===1) rec.dueDate = addDaysISO(1);
    else if(rec.streak===2) rec.dueDate = addDaysISO(4);
    else{ if(!rec.mastered){ rec.mastered=true; rec.dueDate=addDaysISO(7);} else { rec.dueDate=addDaysISO(30); } }
  } else {
    rec.streak = 0; rec.mastered = false; rec.dueDate = addDaysISO(1);
    session.requeue.push({ id:item.id, lang:item.lang, dueTurn: session.turn+3 });
  }
  if(!wasIntroduced) session.newIntroducedCount[item.lang] = (session.newIntroducedCount[item.lang]||0)+1;
  saveState();
}
 
/* =========================================================
   7. STATS
   ========================================================= */
function computeWeeklyStats(){
  const cutoff = addDaysISO(-7);
  const stats = {};
  LANG_ORDER.forEach(l=>{
    let correct=0,total=0,mastered=0,introduced=0;
    ITEMS_BY_LANG[l].forEach(item=>{
      const rec = state.items[item.id]; if(!rec) return;
      if(rec.introduced) introduced++;
      if(rec.mastered) mastered++;
      rec.history.filter(h=>h.date>=cutoff).forEach(h=>{ total++; if(h.result==="correct") correct++; });
    });
    stats[l] = { correct, total, pct: total? Math.round(100*correct/total): null, mastered, introduced, poolSize: ITEMS_BY_LANG[l].length };
  });
  return stats;
}
function findStarving(stats){
  const withData = LANG_ORDER.filter(l=> stats[l].total>=5);
  if(withData.length<2) return [];
  const avg = withData.reduce((s,l)=>s+stats[l].pct,0)/withData.length;
  return withData.filter(l=> stats[l].pct <= avg-15 && stats[l].pct<70);
}

function renderSessionTurn(){
  if(!session){ startSession(); return; }
  const picked = pickNextItem();
  if(!picked){ renderAllCaughtUp(); return; }
  session.currentItem = picked.item;
  session.currentIsNew = picked.isNew;
  session.revealed = !state.settings.audioFirstMode;

}

function handleMic(item, lang){
  const micBtn = document.getElementById("micBtn");
  const micLabel = document.getElementById("micLabel");
  if(!recognitionSupported()){ showResult(item, lang, null, null); return; }
  micBtn.classList.add("listening"); micLabel.textContent = "listening…"; micBtn.disabled = true;
  listenOnce(lang.ttsLang,
    (alternatives)=>{
      micBtn.classList.remove("listening");
      let best = { text:"", score:-1 };
      alternatives.forEach(t=>{ const s = confidenceScore(item.native, t); if(s>best.score) best = { text:t, score:s }; });
      session.revealed = true;
      showResult(item, lang, best.text, best.score);
    },
    (err)=>{
      micBtn.classList.remove("listening");
      micLabel.textContent = err==="not-allowed" ? "microphone permission denied" : "didn't catch that — try again or rate yourself";
      micBtn.disabled = false;
    }
  );
}
function showResult(item, lang, heardText, confidence){

        </div>

      ` : `<div class="heard-row">no automatic scoring available — rate your own attempt</div>`}

      </div>
      <button class="next-btn" id="nextBtn">next</button>
    </div>
  `;
  let selfRating = null;
  document.querySelectorAll("#selfRate button").forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll("#selfRate button").forEach(x=>x.classList.remove("picked")); b.classList.add("picked"); selfRating=b.dataset.v; };
  });
  document.getElementById("nextBtn").onclick = ()=>{
    const finalPassed = hasAuto ? passed : (selfRating==="good");
    if(session.answeredCount===0) registerActivity();
    recordAnswer(item, finalPassed, hasAuto?confidence:null, selfRating, heardText);
    session.answeredCount++;
    renderSessionTurn();
  };
}
function renderAllCaughtUp(){
  document.documentElement.style.setProperty("--accent","var(--maroon)");
  const elapsedMin = Math.round((Date.now()-session.startTime)/60000);
  $main.innerHTML = `
    <div class="empty-state">
      <div class="big">&#10022;</div>
      <div style="font-size:15px; color:var(--ink); margin-bottom:6px; font-family:var(--font-display);">All caught up for now</div>
      <div style="font-size:12.5px;">${session.answeredCount} reviewed &middot; ${elapsedMin} min this session</div>
      <button class="btn primary" id="restartBtn" style="margin-top:20px;">start another round</button>
      <button class="btn" id="homeBtn">back to home</button>
    </div>
  `;
  document.getElementById("restartBtn").onclick = ()=> startSession();
  document.getElementById("homeBtn").onclick = ()=> setView("dashboard");
}
 
/* =========================================================
   11. STATS VIEW
   ========================================================= */
function renderStats(){
  document.documentElement.style.setProperty("--accent","var(--maroon)");
  const stats = computeWeeklyStats();
  const starving = findStarving(stats);
  let rows = "";
  LANG_ORDER.forEach(l=>{
    const s = stats[l];
    const accent = `var(${LANGS[l].accentVar})`;
    const isStarving = starving.includes(l);
    rows += `
      <div class="stat-card ${isStarving?'starving':''}">
        <div class="stat-top">
          <div class="stat-lang"><span class="dot" style="background:${accent}"></span>${LANGS[l].name}</div>
          <div class="stat-pct">${s.pct===null? "no data yet" : s.pct+"% this week"}</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${s.pct||0}%; background:${accent}"></div></div>
        <div class="stat-sub">
          <span>${s.introduced}/${s.poolSize} introduced</span>
          <span>${s.mastered} mastered</span>
          <span>${s.total} reviews (7d)</span>
        </div>
        ${isStarving ? `<div class="starving-tag">&#9888; falling behind the others — consider consolidating</div>` : ``}
      </div>
    `;
  });
  $main.innerHTML = `
    <div class="panel">
      <h2>This week</h2>
      <div class="row" style="border:none; padding-top:0;">
        <div class="row-label">Current streak</div>
        <div class="row-sub" style="margin:0; font-size:13px;">&#128293; ${state.streak.current||0} days &middot; best ${state.streak.longest||0}</div>
      </div>
      <div class="stat-grid" style="margin-top:8px;">${rows}</div>
      <button class="btn" id="exportBtn2">Copy this week's log (for weekly plan prompt)</button>
    </div>
  `;
  document.getElementById("exportBtn2").onclick = doExport;
}
 
/* =========================================================
   12. SETTINGS VIEW
   ========================================================= */

  $main.innerHTML = `
    <div class="panel">
      <h2>Settings</h2>
 
      <h3>Daily session</h3>
      <div class="row">
        <div><div class="row-label">Default length</div><div class="row-sub">tracked, not enforced</div></div>
        <select id="budgetSelect">${[10,15,20,30,45].map(m=>`<option value="${m}" ${m===s.dailyBudgetMin?"selected":""}>${m} min</option>`).join("")}</select>
      </div>
      <div class="row">
        <div><div class="row-label">Audio-first mode</div><div class="row-sub">hide text until you attempt recall from audio alone</div></div>
        <div class="switch ${s.audioFirstMode?'on':''}" id="audioFirstSwitch"></div>

      ${LANG_ORDER.map(l=>`<div class="row"><div class="row-label">${LANGS[l].name}</div><div class="switch ${s.background[l]?'on':''}" data-lang="${l}"></div></div>`).join("")}
 
      <h3>Voices</h3>
      <div class="note" style="margin-top:-4px; margin-bottom:6px;">
        These are synthetic voices built into your browser/device — not recordings of real speakers. I can't source or fabricate
        genuine native-speaker audio here, but you can pick whichever installed voice sounds best for each language.

      ${LANG_ORDER.map(l=>renderVoiceRow(l)).join("")}

      <div class="note" style="margin-top:-4px;">Extend any language's vocabulary — your additions get reviewed on the same schedule.</div>
      ${LANG_ORDER.map(l=>renderCustomWordsBlock(l)).join("")}
 
      <h3>Your data</h3>
      <button class="btn" id="exportBtn">Copy this week's log (for weekly plan prompt)</button>
      <button class="btn danger" id="resetBtn">Reset all progress</button>
      <div class="note">Progress is stored only on this device, in this browser. Nothing is uploaded anywhere.</div>
    </div>
  `;
 
  document.getElementById("budgetSelect").onchange = (e)=>{ s.dailyBudgetMin = parseInt(e.target.value,10); saveState(); };
  document.getElementById("audioFirstSwitch").onclick = (el)=>{
    s.audioFirstMode = !s.audioFirstMode; saveState(); renderSettings();
  };
  document.querySelectorAll(".switch[data-lang]").forEach(sw=>{
    sw.onclick = ()=>{ const l=sw.dataset.lang; s.background[l]=!s.background[l]; sw.classList.toggle("on", s.background[l]); saveState(); };
  });
  LANG_ORDER.forEach(l=>{
    const sel = document.getElementById("voiceSelect-"+l);
    if(sel) sel.onchange = (e)=>{ s.voicePref[l] = e.target.value; saveState(); };
    const testBtn = document.getElementById("voiceTest-"+l);
    if(testBtn) testBtn.onclick = ()=>{ const sample = VOCAB[l].words[0][0]; speak(sample, l); };
    const addBtn = document.getElementById("addWord-"+l);
    if(addBtn) addBtn.onclick = ()=> addCustomWord(l);
  });
  document.querySelectorAll(".custom-item button[data-del]").forEach(b=>{
    b.onclick = ()=> deleteCustomWord(b.dataset.del);
  });
  document.getElementById("exportBtn").onclick = doExport;
  document.getElementById("resetBtn").onclick = ()=>{
    if(confirm("This clears all review history and progress on this device. Continue?")){
      state.items = {}; saveState(); session = null; setView("dashboard");
    }
  };
}
function renderVoiceRow(l){
  const langTag = LANGS[l].ttsLang;
  const options = voicesForLang(langTag);
  const current = state.settings.voicePref[l] || "";
  return `
    <div class="row">
      <div class="row-label">${LANGS[l].name}</div>
      <div style="display:flex; gap:6px; align-items:center;">
        <select id="voiceSelect-${l}" style="max-width:150px;">
          <option value="">auto</option>
          ${options.map(v=>`<option value="${escapeHtml(v.name+"|"+v.lang)}" ${current===(v.name+"|"+v.lang)?"selected":""}>${escapeHtml(v.name)}</option>`).join("")}
        </select>
        <button class="btn small" id="voiceTest-${l}">&#9658;</button>
      </div>
    </div>
    ${options.length===0 ? `<div class="note" style="margin-top:-2px;">no ${LANGS[l].name} voice installed on this device — default system voice will be used</div>` : ``}
  `;
}
function renderCustomWordsBlock(l){
  const mine = (state.customItems||[]).filter(it=>it.lang===l);
  return `
    <div class="row-sub" style="margin:12px 0 6px; font-weight:600; color:var(--ink-soft);">${LANGS[l].name}</div>
    ${mine.map(it=>`<div class="custom-item"><span>${escapeHtml(it.native)} — ${escapeHtml(it.en)}</span><button data-del="${it.id}">&times;</button></div>`).join("")}
    <input type="text" id="cw-native-${l}" placeholder="word/phrase (native script)">
    <input type="text" id="cw-translit-${l}" placeholder="transliteration (optional)">
    <input type="text" id="cw-en-${l}" placeholder="English meaning">
    <button class="btn small" id="addWord-${l}">Add word</button>
  `;
}
function addCustomWord(l){
  const native = document.getElementById("cw-native-"+l).value.trim();
  const translit = document.getElementById("cw-translit-"+l).value.trim();
  const en = document.getElementById("cw-en-"+l).value.trim();
  if(!native || !en){ alert("Please fill in at least the word and its English meaning."); return; }
  const id = "custom-"+l+"-"+Date.now()+"-"+Math.floor(Math.random()*1000);
  state.customItems.push({ id, lang:l, tier:"vocab", native, translit: translit||null, en, cat:"custom" });
  saveState();
  rebuildItemsIndex();
  renderSettings();
}
function deleteCustomWord(id){
  state.customItems = (state.customItems||[]).filter(it=>it.id!==id);
  delete state.items[id];
  saveState();
  rebuildItemsIndex();
  renderSettings();
}
 
/* =========================================================
   13. EXPORT
   ========================================================= */
function doExport(){
  const cutoff = addDaysISO(-7);
  const byLang = {}; LANG_ORDER.forEach(l=> byLang[l]=[]);
  Object.values(ITEMS).forEach(item=>{
    const rec = state.items[item.id]; if(!rec) return;
    const recent = rec.history.filter(h=>h.date>=cutoff); if(recent.length===0) return;
    byLang[item.lang].push({ native:item.native, translit:item.translit, en:item.en, category:item.cat, tier:item.tier, mastered:rec.mastered, streak:rec.streak, history:recent });
  });
  const payload = { generated: todayISO(), streak: state.streak, note:"Weekly log from the Five Languages app — paste this after the weekly lesson plan prompt.", languages: byLang };
  const text = JSON.stringify(payload, null, 2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> alert("Weekly log copied. Paste it into a chat with your weekly lesson plan prompt."), ()=> fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Weekly log copied."); } catch(e){ prompt("Copy this manually:", text); }
  document.body.removeChild(ta);
}

}
