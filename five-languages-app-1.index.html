<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5 Languages">
<meta name="theme-color" content="#141320">
<title>Five Languages, One Adult</title>
<style>
  :root{
    --ink: #141320;
    --ink-2: #1c1b2b;
    --card: #211f33;
    --card-edge: rgba(237,234,226,0.09);
    --paper: #EDEAE2;
    --paper-dim: #b7b4ac;
    --muted: #8a87a3;
    --good: #52c48a;
    --bad: #e15252;

    --ar: #d4a455;
    --zu: #2fb6a6;
    --es: #e15252;
    --de: #7c8ae0;
    --ru: #b15fcb;

    --accent: var(--zu);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Courier New", monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.05), transparent 60%),
      var(--ink);
    color: var(--paper);
    font-family: var(--font-ui);
    -webkit-tap-highlight-color: transparent;
    min-height:100%;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) 0;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 10px;
  }
  .lang-dots{ display:flex; gap:7px; }
  .lang-dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--dot-color, var(--muted));
    opacity:0.35;
    transition: opacity .25s, transform .25s;
  }
  .lang-dot.on{ opacity:1; transform:scale(1.25); }
  header h1{
    font-family: var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
  }
  .icon-btn{
    background:none; border:none; color:var(--paper-dim); cursor:pointer;
    width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }
  .icon-btn:active{ background:rgba(255,255,255,0.06); }

  main{ flex:1; display:flex; flex-direction:column; padding: 6px 18px 18px; }

  /* ---------- stamp / signature element ---------- */
  .stamp-wrap{ display:flex; justify-content:center; margin: 10px 0 4px; }
  .stamp{
    position:relative;
    width:118px; height:118px;
    border-radius:50%;
    border: 2.5px dashed var(--accent);
    display:flex; align-items:center; justify-content:center;
    transform: rotate(-7deg);
    color: var(--accent);
    transition: border-color .4s, color .4s;
    filter: url(#inkTexture);
  }
  .stamp-inner{
    width:96px; height:96px;
    border-radius:50%;
    border: 1px solid var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    text-align:center;
  }
  .stamp-native{ font-size:22px; font-weight:600; line-height:1; }
  .stamp-code{
    font-family: var(--font-mono);
    font-size:9px; letter-spacing:.2em; text-transform:uppercase; opacity:.85;
  }

  /* ---------- card ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius:20px;
    padding: 26px 22px 20px;
    margin-top:14px;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .card-tag{
    font-family:var(--font-mono);
    font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--accent);
    margin-bottom:14px;
    display:flex; align-items:center; gap:8px;
  }
  .card-tag::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); }

  .word-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
    padding: 6px 0 14px;
  }
  .word-native{
    font-size:44px;
    font-weight:600;
    line-height:1.15;
    word-break:break-word;
  }
  .word-native[dir="rtl"]{ font-family: var(--font-ui); }
  .word-translit{
    font-family: var(--font-mono);
    font-size:16px;
    color: var(--paper-dim);
    letter-spacing:.01em;
  }
  .word-en{
    margin-top:8px;
    font-size:15px;
    color: var(--muted);
  }

  .replay-btn{
    margin-top:14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-edge);
    color: var(--paper);
    padding:8px 16px;
    border-radius:100px;
    font-size:13px;
    display:flex; align-items:center; gap:7px;
    cursor:pointer;
  }
  .replay-btn:active{ background: rgba(255,255,255,0.1); }

  /* ---------- mic / result zone ---------- */
  .action-zone{ display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:6px; }

  .mic-btn{
    width:74px; height:74px; border-radius:50%;
    border:none;
    background: var(--accent);
    color:#12111c;
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 0 0 0 rgba(255,255,255,0.0);
    transition: transform .15s;
  }
  .mic-btn:active{ transform:scale(.94); }
  .mic-btn.listening{ animation: pulse 1.1s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(237,234,226,.35); }
    70%{ box-shadow: 0 0 0 18px rgba(237,234,226,0); }
    100%{ box-shadow: 0 0 0 0 rgba(237,234,226,0); }
  }
  .mic-label{ font-size:12.5px; color:var(--muted); }

  .result-panel{ width:100%; display:flex; flex-direction:column; gap:12px; }
  .heard-row{
    background: rgba(255,255,255,0.04);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    color: var(--paper-dim);
  }
  .heard-row b{ color:var(--paper); font-weight:600; }
  .meter{
    height:8px; border-radius:100px; background:rgba(255,255,255,0.08); overflow:hidden;
  }
  .meter-fill{ height:100%; border-radius:100px; transition: width .4s; }
  .meter-label{
    display:flex; justify-content:space-between; font-family:var(--font-mono);
    font-size:11px; color:var(--muted); margin-top:5px;
  }
  .verdict{
    font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px;
  }
  .verdict.pass{ color: var(--good); }
  .verdict.fail{ color: var(--bad); }

  .self-rate{ display:flex; gap:8px; }
  .self-rate button{
    flex:1; padding:10px 6px; border-radius:12px; border:1px solid var(--card-edge);
    background:rgba(255,255,255,0.03); color:var(--paper-dim); font-size:12.5px; cursor:pointer;
  }
  .self-rate button.picked{ border-color: var(--accent); color:var(--accent); background:rgba(255,255,255,0.06); }

  .next-btn{
    margin-top:2px;
    background: var(--paper);
    color:#171625;
    border:none; border-radius:14px;
    padding:14px; font-size:15px; font-weight:600;
    cursor:pointer;
  }
  .next-btn:active{ opacity:.85; }

  /* ---------- footer / session bar ---------- */
  .session-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 4px 4px;
    font-family: var(--font-mono);
    font-size:11px; color:var(--muted);
  }
  .session-bar .dim{ opacity:.6; }

  /* ---------- panels (settings / stats / done / onboarding) ---------- */
  .panel{ padding-top:4px; }
  .panel h2{ font-size:19px; margin:2px 0 16px; }
  .panel h3{ font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:22px 0 10px; }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--card-edge); gap:12px; }
  .row:last-child{ border-bottom:none; }
  .row-label{ font-size:14.5px; }
  .row-sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .switch{ position:relative; width:44px; height:26px; border-radius:100px; background:rgba(255,255,255,0.1); cursor:pointer; flex-shrink:0; }
  .switch.on{ background: var(--accent); }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .18s; }
  .switch.on::after{ left:21px; }
  select, input[type=range]{ accent-color: var(--zu); }
  select{
    background: var(--card); color:var(--paper); border:1px solid var(--card-edge);
    border-radius:10px; padding:8px 10px; font-size:14px;
  }
  .btn{
    width:100%; padding:13px; border-radius:12px; border:1px solid var(--card-edge);
    background:rgba(255,255,255,0.04); color:var(--paper); font-size:14px; margin-top:10px; cursor:pointer;
    text-align:center;
  }
  .btn.primary{ background:var(--paper); color:#171625; border:none; font-weight:600; }
  .btn.danger{ color: var(--bad); border-color: rgba(225,82,82,.35); }
  .note{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:8px; }

  .stat-grid{ display:flex; flex-direction:column; gap:10px; }
  .stat-card{
    background:var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:14px 16px;
  }
  .stat-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .stat-lang{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .stat-lang .dot{ width:8px; height:8px; border-radius:50%; }
  .stat-pct{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }
  .bar-track{ height:6px; background:rgba(255,255,255,0.08); border-radius:100px; margin-top:9px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:100px; }
  .stat-sub{ display:flex; gap:14px; margin-top:8px; font-size:11.5px; color:var(--muted); font-family:var(--font-mono); }

  .empty-state{ text-align:center; padding: 60px 10px; color:var(--muted); }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }

  a{ color: var(--zu); }
  ::selection{ background: rgba(255,255,255,0.2); }
</style>
</head>

<svg width="0" height="0" style="position:absolute">

    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="4"/>

</div>

// Flatten into a single ITEMS map: id -> {lang, tier, native, translit, en, cat}
const ITEMS = {};
LANG_ORDER.forEach(lang=>{
  VOCAB[lang].words.forEach((w,i)=>{
    const id = lang+"-vocab-"+i;
    ITEMS[id] = { id, lang, tier:"vocab", native:w[0], translit:w[1], en:w[2], cat:w[3] };
  });
  VOCAB[lang].phrases.forEach((p,i)=>{
    const id = lang+"-phrase-"+i;
    ITEMS[id] = { id, lang, tier:"phrase", native:p[0], translit:p[1], en:p[2], cat:"phrase" };
  });
});
const ITEMS_BY_LANG = {};
LANG_ORDER.forEach(l=> ITEMS_BY_LANG[l] = Object.values(ITEMS).filter(it=>it.lang===l));

/* =========================================================
   2. STATE — persistence
   ========================================================= */
const STORAGE_KEY = "fivelang_state_v1";

function defaultState(){
  return {
    settings: {
      dailyBudgetMin: 15,
      background: { ar:false, zu:true, es:false, de:false, ru:false },
      newCapBackground: 5,
      newCapZero: 3,
      onboarded: false
    },
    items: {} // id -> record
  };
}

let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    return {
      settings: Object.assign(d.settings, parsed.settings||{}),
      items: parsed.items || {}
    };
  }catch(e){
    console.warn("could not read saved progress, starting fresh", e);
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("could not save progress", e); }
}
function getRecord(id){
  if(!state.items[id]){
    state.items[id] = { introduced:false, streak:0, mastered:false, dueDate:null, lastSeen:null, history:[] };
  }
  return state.items[id];
}

/* =========================================================
   3. DATE HELPERS
   ========================================================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(n){
  const d = new Date();
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function isDue(dueDate){ return !dueDate || dueDate <= todayISO(); }

/* =========================================================
   4. TEXT MATCHING — normalize + levenshtein confidence
   ========================================================= */
function normalizeText(s){
  if(!s) return "";
  let x = s.toLowerCase().trim();
  x = x.normalize("NFD").replace(/[\u0300-\u036f]/g,"");   // latin/cyrillic combining marks
  x = x.replace(/[\u064B-\u065F\u0670]/g,"");                 // arabic harakat
  x = x.replace(/[^\p{L}\p{N}\s']/gu,"");
  x = x.replace(/\s+/g," ").trim();
  return x;
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = new Array(n+1);
  for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){
    let prev = dp[0];
    dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp = dp[j];
      dp[j] = Math.min(
        dp[j]+1,
        dp[j-1]+1,
        prev + (a[i-1]===b[j-1]?0:1)
      );
      prev = tmp;
    }
  }
  return dp[n];
}
function confidenceScore(expected, heard){
  const e = normalizeText(expected), h = normalizeText(heard);
  if(!h) return 0;
  const dist = levenshtein(e,h);
  const maxLen = Math.max(e.length, h.length, 1);
  return Math.max(0, Math.min(100, Math.round(100*(1-dist/maxLen))));
}
const PASS_THRESHOLD = 45; // loose on purpose: false rejects cost more than false accepts here

/* =========================================================
   5. SPEECH — synthesis + recognition
   ========================================================= */
let voicesCache = [];
function loadVoices(){ voicesCache = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, langTag){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langTag;
  const match = voicesCache.find(v=>v.lang===langTag) || voicesCache.find(v=>v.lang && v.lang.startsWith(langTag.split("-")[0]));
  if(match) u.voice = match;
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recognitionSupported(){ return !!SR; }

function listenOnce(langTag, onResult, onError){
  if(!SR){ onError("unsupported"); return null; }
  const rec = new SR();
  rec.lang = langTag;
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  rec.continuous = false;
  let done = false;
  rec.onresult = (e)=>{
    done = true;
    const alts = Array.from(e.results[0]).map(a=>a.transcript);
    onResult(alts);
  };
  rec.onerror = (e)=>{ if(!done){ done=true; onError(e.error||"error"); } };
  rec.onend = ()=>{ if(!done){ done=true; onError("no-speech"); } };
  try{ rec.start(); }catch(err){ onError("start-failed"); return null; }
  return rec;
}

/* =========================================================
   6. SESSION ENGINE
   ========================================================= */
let session = null; // built on start

function newItemCap(lang){
  return state.settings.background[lang] ? state.settings.newCapBackground : state.settings.newCapZero;
}
function phrasesUnlocked(lang){
  const introducedVocab = ITEMS_BY_LANG[lang].filter(it=>it.tier==="vocab" && getRecord(it.id).introduced).length;
  return introducedVocab >= 20;
}

function startSession(){
  session = {
    startTime: Date.now(),
    turn: 0,
    lastLang: null,
    newIntroducedCount: Object.fromEntries(LANG_ORDER.map(l=>[l,0])),
    requeue: [], // {id, dueTurn}
    currentItem: null,
    answeredCount: 0,
    micRecognition: null
  };
  renderSession();
}

function poolsForLang(lang){
  const all = ITEMS_BY_LANG[lang];
  const unlocked = phrasesUnlocked(lang);
  const usable = all.filter(it=> it.tier==="vocab" || unlocked);
  const due = usable.filter(it=>{
    const r = getRecord(it.id);
    return r.introduced && isDue(r.dueDate);
  });
  const fresh = usable.filter(it=> !getRecord(it.id).introduced);
  return { due, fresh };
}

function pickNextItem(){
  session.turn++;
  const t = session.turn;

  // 1. session requeue (missed items due again, 3 turns later)
  const readyIdx = session.requeue.findIndex(r=> r.dueTurn <= t && r.lang !== session.lastLang);
  const readyIdxAny = readyIdx>=0 ? readyIdx : session.requeue.findIndex(r=> r.dueTurn <= t);
  if(readyIdxAny >= 0){
    const entry = session.requeue.splice(readyIdxAny,1)[0];
    return { item: ITEMS[entry.id], isNew:false };
  }

  // gather candidate languages, preferring not-last-language
  const langsPreferred = LANG_ORDER.filter(l=>l!==session.lastLang);
  const langsAll = LANG_ORDER;

  function tryLangs(list){
    // shuffle for variety
    const shuffled = [...list].sort(()=>Math.random()-0.5);
    for(const lang of shuffled){
      const {due} = poolsForLang(lang);
      if(due.length){
        due.sort((a,b)=> (getRecord(a.id).dueDate||"") < (getRecord(b.id).dueDate||"") ? -1 : 1);
        return { item: due[0], isNew:false };
      }
    }
    for(const lang of shuffled){
      if(session.newIntroducedCount[lang] >= newItemCap(lang)) continue;
      const {fresh} = poolsForLang(lang);
      if(fresh.length){
        return { item: fresh[0], isNew:true };
      }
    }
    return null;
  }

  return tryLangs(langsPreferred) || tryLangs(langsAll);
}

function recordAnswer(item, passed, confidence, selfRating, heardText){
  const rec = getRecord(item.id);
  const wasIntroduced = rec.introduced;
  rec.introduced = true;
  rec.lastSeen = todayISO();
  rec.history.push({ date: todayISO(), result: passed?"correct":"incorrect", confidence, selfRating: selfRating||null, heard: heardText||null });
  if(rec.history.length > 60) rec.history = rec.history.slice(-60);

  if(passed){
    rec.streak = (rec.streak||0)+1;
    if(rec.streak===1) rec.dueDate = addDaysISO(1);
    else if(rec.streak===2) rec.dueDate = addDaysISO(4);
    else{
      if(!rec.mastered){ rec.mastered = true; rec.dueDate = addDaysISO(7); }
      else{ rec.dueDate = addDaysISO(30); }
    }
  } else {
    rec.streak = 0;
    rec.mastered = false;
    rec.dueDate = addDaysISO(1);
    session.requeue.push({ id:item.id, lang:item.lang, dueTurn: session.turn+3 });
  }
  if(!wasIntroduced){
    session.newIntroducedCount[item.lang] = (session.newIntroducedCount[item.lang]||0)+1;
  }
  saveState();
}

/* =========================================================
   7. RENDERING
   ========================================================= */
const $main = document.getElementById("main");
const $langDots = document.getElementById("langDots");
const $headerTitle = document.getElementById("headerTitle");

function setAccent(lang){
  const v = getComputedStyle(document.documentElement).getPropertyValue(LANGS[lang].accentVar).trim();
  document.documentElement.style.setProperty("--accent", v);
}

function renderDots(activeLang){
  $langDots.innerHTML = "";
  LANG_ORDER.forEach(l=>{
    const dot = document.createElement("div");
    dot.className = "lang-dot" + (l===activeLang ? " on":"");
    dot.style.setProperty("--dot-color", `var(${LANGS[l].accentVar})`);
    $langDots.appendChild(dot);
  });
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderSession(){
  if(!session){ startSession(); return; }
  $headerTitle.textContent = "five languages";

  const budgetMs = state.settings.dailyBudgetMin*60000;
  const elapsedMs = Date.now()-session.startTime;

  const picked = pickNextItem();
  if(!picked){
    renderAllCaughtUp();
    return;
  }
  session.currentItem = picked.item;
  session.currentIsNew = picked.isNew;
  session.lastLang = picked.item.lang;
  const item = picked.item;
  const lang = LANGS[item.lang];
  setAccent(item.lang);
  renderDots(item.lang);

  const catLabel = item.tier==="phrase" ? "phrase" : item.cat;

  $main.innerHTML = `
    <div class="stamp-wrap">
      <div class="stamp"><div class="stamp-inner">
        <div class="stamp-native" style="direction:${lang.rtl?'rtl':'ltr'}">${escapeHtml(lang.native)}</div>
        <div class="stamp-code">${item.lang}</div>
      </div></div>
    </div>
    <div class="card">
      <div class="card-tag">${lang.name} &middot; ${catLabel}${picked.isNew?" &middot; new":""}</div>
      <div class="word-zone">
        <div class="word-native" dir="${lang.rtl?'rtl':'ltr'}">${escapeHtml(item.native)}</div>
        ${item.translit ? `<div class="word-translit">${escapeHtml(item.translit)}</div>` : ``}
        <div class="word-en">${escapeHtml(item.en)}</div>
        <button class="replay-btn" id="replayBtn">&#9658; hear it again</button>
      </div>
      <div class="action-zone" id="actionZone">
        <button class="mic-btn" id="micBtn">&#127908;</button>
        <div class="mic-label" id="micLabel">${recognitionSupported() ? "tap and say it out loud" : "mic input not supported here — rate yourself after listening"}</div>
      </div>
    </div>
    <div class="session-bar">
      <span>${Math.floor(elapsedMs/60000)}:${String(Math.floor((elapsedMs%60000)/1000)).padStart(2,"0")} <span class="dim">/ ${state.settings.dailyBudgetMin}:00</span></span>
      <span>${session.answeredCount} reviewed today</span>
    </div>
  `;

  speak(item.native, lang.ttsLang);
  document.getElementById("replayBtn").onclick = ()=> speak(item.native, lang.ttsLang);
  document.getElementById("micBtn").onclick = ()=> handleMic(item, lang);
}

function handleMic(item, lang){
  const micBtn = document.getElementById("micBtn");
  const micLabel = document.getElementById("micLabel");
  if(!recognitionSupported()){
    showResult(item, lang, null, null);
    return;
  }
  micBtn.classList.add("listening");
  micLabel.textContent = "listening…";
  micBtn.disabled = true;
  listenOnce(lang.ttsLang,
    (alternatives)=>{
      micBtn.classList.remove("listening");
      let best = { text:"", score:-1 };
      alternatives.forEach(t=>{
        const s = confidenceScore(item.native, t);
        if(s>best.score) best = { text:t, score:s };
      });
      showResult(item, lang, best.text, best.score);
    },
    (err)=>{
      micBtn.classList.remove("listening");
      micLabel.textContent = err==="not-allowed" ? "microphone permission denied" : "didn't catch that — try again or rate yourself";
      micBtn.disabled = false;
    }
  );
}

function showResult(item, lang, heardText, confidence){
  const passed = confidence!==null && confidence>=PASS_THRESHOLD;
  const hasAuto = confidence!==null;
  const $zone = document.getElementById("actionZone");
  $zone.innerHTML = `
    <div class="result-panel">
      ${hasAuto ? `
        <div class="heard-row">you said: <b>${escapeHtml(heardText||"(nothing heard)")}</b></div>
        <div>
          <div class="meter"><div class="meter-fill" style="width:${confidence}%; background:${passed?'var(--good)':'var(--bad)'}"></div></div>
          <div class="meter-label"><span>confidence</span><span>${confidence}%</span></div>
        </div>
        <div class="verdict ${passed?'pass':'fail'}">${passed? '&#10003; close enough' : '&#10005; try again next time'}</div>
      ` : `<div class="heard-row">no automatic scoring available — rate your own attempt</div>`}
      <div>
        <div class="row-sub" style="margin-bottom:6px;">how did it feel?</div>
        <div class="self-rate" id="selfRate">
          <button data-v="good">felt right</button>
          <button data-v="unsure">not sure</button>
          <button data-v="bad">way off</button>
        </div>
      </div>
      <button class="next-btn" id="nextBtn">next</button>
    </div>
  `;
  let selfRating = null;
  document.querySelectorAll("#selfRate button").forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll("#selfRate button").forEach(x=>x.classList.remove("picked"));
      b.classList.add("picked");
      selfRating = b.dataset.v;
    };
  });
  document.getElementById("nextBtn").onclick = ()=>{
    const finalPassed = hasAuto ? passed : (selfRating==="good");
    recordAnswer(item, finalPassed, hasAuto?confidence:null, selfRating, heardText);
    session.answeredCount++;
    renderSession();
  };
}

function renderAllCaughtUp(){
  $headerTitle.textContent = "five languages";
  renderDots(null);
  document.documentElement.style.setProperty("--accent", "var(--zu)");
  const elapsedMin = Math.round((Date.now()-session.startTime)/60000);

    <div class="empty-state">

      <div style="font-size:16px; color:var(--paper); margin-bottom:6px;">All caught up for now</div>
      <div style="font-size:13px;">${session.answeredCount} reviewed &middot; ${elapsedMin} min this session</div>

function doExport(){
  const cutoff = addDaysISO(-7);
  const byLang = {};
  LANG_ORDER.forEach(l=> byLang[l] = []);
  Object.values(ITEMS).forEach(item=>{
    const rec = state.items[item.id];
    if(!rec) return;
    const recent = rec.history.filter(h=>h.date>=cutoff);
    if(recent.length===0) return;
    byLang[item.lang].push({
      native: item.native, translit: item.translit, en: item.en, category: item.cat, tier: item.tier,
      mastered: rec.mastered, streak: rec.streak, history: recent
    });
  });
  const payload = {
    generated: todayISO(),
    note: "Weekly log from the Five Languages app — paste this after the weekly lesson plan prompt.",
    languages: byLang
  };
  const text = JSON.stringify(payload, null, 2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=> alert("Weekly log copied. Paste it into a chat with your weekly lesson plan prompt."),
      ()=> fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Weekly log copied."); }
  catch(e){ prompt("Copy this manually:", text); }
  document.body.removeChild(ta);
}

    let correct=0, total=0, mastered=0, introduced=0;

      if(!rec) return;
      if(rec.introduced) introduced++;
      if(rec.mastered) mastered++;
      rec.history.filter(h=>h.date>=cutoff).forEach(h=>{
        total++; if(h.result==="correct") correct++;

    const pct = total ? Math.round(100*correct/total) : null;
    const accent = `var(${LANGS[l].accentVar})`;
    rows += `
      <div class="stat-card">
        <div class="stat-top">
          <div class="stat-lang"><span class="dot" style="background:${accent}"></span>${LANGS[l].name}</div>
          <div class="stat-pct">${pct===null? "no data yet" : pct+"% this week"}</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct||0}%; background:${accent}"></div></div>
        <div class="stat-sub">
          <span>${introduced}/${items.length} introduced</span>
          <span>${mastered} mastered</span>
          <span>${total} reviews (7d)</span>
        </div>
      </div>
    `;
  });
  $main.innerHTML = `
    <div class="panel">
      <h2>This week</h2>
      <div class="stat-grid">${rows}</div>
      <button class="btn" id="exportBtn2">Copy this week's log (for weekly plan prompt)</button>
      <button class="btn primary" id="doneBtn2" style="margin-top:14px;">Back to session</button>
    </div>
  `;
  document.getElementById("exportBtn2").onclick = doExport;
  document.getElementById("doneBtn2").onclick = ()=>{ session ? renderSession() : startSession(); };
}

/* ---------- onboarding (first run only) ---------- */
function renderOnboarding(){
  $headerTitle.textContent = "welcome";
  renderDots(null);
  const s = state.settings;
  $main.innerHTML = `
    <div class="panel">
      <h2>Five Languages, One Adult</h2>
      <div class="note" style="font-size:13.5px; margin-bottom:10px;">
        One session, five languages, rotating — Arabic, isiZulu, Spanish, German, Russian. Words repeat on a schedule based on
        how well you know them. Text and audio are both on; you'll say each item back and get a rough confidence score plus a
        chance to rate yourself.
      </div>
      <h3>Background</h3>
      ${LANG_ORDER.map(l=>`
        <div class="row">
          <div class="row-label">${LANGS[l].name}</div>
          <div class="switch ${s.background[l]?'on':''}" data-lang="${l}"></div>
        </div>
      `).join("")}
      <h3>Daily length</h3>
      <div class="row">
        <div class="row-label">Default session</div>
        <select id="budgetSelect2">
          ${[10,15,20,30,45].map(m=>`<option value="${m}" ${m===s.dailyBudgetMin?"selected":""}>${m} min</option>`).join("")}
        </select>
      </div>
      <button class="btn primary" id="startBtn" style="margin-top:22px;">Start</button>
      <div class="note">Add this page to your home screen (share icon → Add to Home Screen) to open it like an app. Everything runs
      locally in this browser — no account, no server, no data leaves your device except when you choose to copy your log.</div>
    </div>
  `;
  document.querySelectorAll(".switch[data-lang]").forEach(sw=>{
    sw.onclick = ()=>{
      const l = sw.dataset.lang;
      s.background[l] = !s.background[l];
      sw.classList.toggle("on", s.background[l]);
    };
  });
  document.getElementById("budgetSelect2").onchange = (e)=>{ s.dailyBudgetMin = parseInt(e.target.value,10); };
  document.getElementById("startBtn").onclick = ()=>{
    s.onboarded = true;
    saveState();
    startSession();
  };
}

/* =========================================================
   8. NAV
   ========================================================= */
document.getElementById("settingsBtn").onclick = renderSettings;
document.getElementById("statsBtn").onclick = renderStats;

if(!state.settings.onboarded){
  renderOnboarding();
} else {
  startSession();
}

})();
</script>
</body>
